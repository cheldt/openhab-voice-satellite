# Nightly vulnerability scan of locked Python dependencies using pip-audit.

name: Security scan

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest

    steps:
    # full-SHA pins, not tags: see the note in python-app.yml
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      with:
        python-version: "3.12"
    - name: Export locked requirements
      run: uv export --format requirements-txt --no-emit-project --all-extras -o requirements-audit.txt
    - name: Add the production pins that live outside the lock
      # openwakeword is deliberately absent from project metadata (its own
      # metadata hard-requires tflite-runtime, see pyproject.toml) and is
      # pinned to exactly 0.6.0 forever by wakeword_buffer.PATCHED_VERSION.
      # Without this line the one production dependency guaranteed to grow
      # stale is the only one the scan structurally cannot see.
      #
      # Hashed, because `uv export` emits a hashed file and pip-audit's
      # --disable-pip mode refuses to mix: an unhashed line fails the whole
      # step with "requirement openwakeword==0.6.0 does not contain a hash".
      # Digests are the wheel and sdist from PyPI's release JSON.
      run: |
        cat >> requirements-audit.txt <<'EOF'
        openwakeword==0.6.0 \
            --hash=sha256:6f423a4e3ae9dd0e3cd12b50ff8abf69679f687b4ab349d7c82c021c0e2abc9d \
            --hash=sha256:36858d90f1183e307485597a912a4e3c3384b14ea9923f83feaffae7c1565565
        EOF
    - name: Audit dependencies
      run: uv run --with pip-audit pip-audit --strict -r requirements-audit.txt --disable-pip
