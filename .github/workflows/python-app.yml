# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install GStreamer and GObject introspection
      # runner has no PipeWire daemon: gst tests only construct pipelines
      # from fake elements; anything needing live audio is marked/skipped
      run: |
        sudo apt-get update
        sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev \
          gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
          gstreamer1.0-plugins-base gstreamer1.0-pipewire
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Install dependencies
      run: uv sync --extra dev --extra gst
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run --with flake8 flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings; line length/complexity come from .flake8
        uv run --with flake8 flake8 . --count --exit-zero --statistics
    - name: Test with pytest
      run: uv run pytest -m "not slow"
