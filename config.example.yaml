# stt-proxy configuration. Copy to config.yaml and adjust.
# Relative paths are resolved against this file's directory.

audio:
  input_device: null        # substring of device name (see: stt-proxy --list-devices); null = default
  output_device: null
  sample_rate: 16000
  frame_ms: 80              # 1280 samples = one openWakeWord chunk

wakeword:
  model: "hey_jarvis"       # openWakeWord pretrained name or path to a custom .onnx
  threshold: 0.5
  threshold_speaking: 0.7   # raised while TTS is audible (echo mitigation)
  stop_model: null          # optional: path to a custom-trained "stop" model (.onnx)
  stop_threshold: 0.5

vad:
  threshold: 0.5
  silence_ms: 1200          # trailing silence that ends the utterance
  no_speech_timeout_s: 8    # LISTENING -> IDLE if nothing is said
  max_utterance_s: 15

stt:
  model: "small"            # faster-whisper model name or local path ("base" = faster, less accurate)
  compute_type: "int8"
  cpu_threads: 4
  beam_size: 1              # 1 = greedy (fastest); 5 = more accurate, much slower
  languages: ["de", "en"]   # auto-detect restricted to these; single entry skips detection

openhab:
  url: "http://openhab.local:8080"
  api_token: null           # or set env var OPENHAB_TOKEN (env wins)
  # ?llmTools= param for /rest/voice/interpreters; null = omit.
  # "web-search" needs the org.openhab.voice.websearch add-on + a SearxNG instance.
  llm_tools: "item-send-command,item-get-state,get-date-time,web-search"
  response_timeout_s: 30
  verify_ssl: true          # false accepts self-signed certificates

tts:
  voices:
    de:
      model: "models/kokoro/kokoro-martin.onnx"
      voices: "models/kokoro/voices-martin.npz"
      voice: "martin"          # only voice in this file
      lang: "de"               # espeak phonemizer language
      speed: 1.0
    en:
      model: "models/kokoro/kokoro-v1.0.onnx"   # or kokoro-v1.0.int8.onnx (smaller/faster)
      voices: "models/kokoro/voices-v1.0.bin"
      voice: "bf_emma"         # any voice from voices-v1.0.bin
      lang: "en-gb"
      speed: 1.0
  default_language: "de"

barge_in:
  resume_listening: true    # wakeword during playback -> straight back to LISTENING

dialog:
  enabled: true             # after every answer the mic re-opens (no wakeword) for a follow-up
  followup_timeout_s: 6     # silence that ends the conversation (first turn uses vad.no_speech_timeout_s)
  earcon: "wake"            # earcon when the follow-up mic opens ("wake" or "ack")

earcons:
  enabled: true
  wake: "sounds/wake.wav"
  ack: "sounds/ack.wav"
  error: "sounds/error.wav"

logging:
  level: "INFO"
