# openhab-voice-satellite configuration. Copy to config.yaml and adjust.
# Relative paths are resolved against this file's directory.

audio:
  input_device: null        # substring of device name (see: openhab-voice-satellite --list-devices); null = default
  output_device: null
  sample_rate: 16000
  frame_ms: 80              # 1280 samples = one openWakeWord chunk
  input_latency: high       # "low", "high", or seconds; high = bigger capture buffer, fewer overflows under CPU load
  output_lead_in_ms: 300    # silence prepended to playback; masks USB-DAC unmute delay

wakeword:
  model: "hey_jarvis"       # openWakeWord pretrained name or path to a custom .onnx
  threshold: 0.5
  threshold_speaking: 0.7   # raised while TTS is audible (echo mitigation)
  stop_model: null          # optional: path to a custom-trained "stop" model (.onnx)
  stop_threshold: 0.5

vad:
  threshold: 0.5
  silence_ms: 1200          # trailing silence that ends the utterance
  no_speech_timeout_s: 8    # LISTENING -> IDLE if nothing is said
  max_utterance_s: 15

stt:
  engine: "local"           # "gemini"/"deepgram" = cloud STT; falls back to local whisper on failure
  model: "small"            # faster-whisper model name or local path ("base" = faster, less accurate)
  compute_type: "int8"
  cpu_threads: 4
  beam_size: 1              # 1 = greedy (fastest); 5 = more accurate, much slower
  languages: ["de", "en"]   # auto-detect restricted to these; single entry skips detection

openhab:
  url: "http://openhab.local:8080"
  api_token: null           # or set env var OPENHAB_TOKEN (env wins)
  # ?llmTools= param for /rest/voice/interpreters; null = omit.
  # "web-search" needs the org.openhab.voice.websearch add-on + a SearxNG instance.
  llm_tools: "item-send-command,item-get-state,get-date-time,web-search"
  response_timeout_s: 30
  verify_ssl: true          # false accepts self-signed certificates

tts:
  engine: "kokoro"          # "kokoro"/"piper" = local; "gemini"/"deepgram" = cloud TTS, falls back to kokoro on failure
  default_language: "de"

# Used when tts.engine is "kokoro" and as fallback for the cloud engines.
kokoro:
  voices:
    de:
      model: "models/kokoro/kokoro-martin.onnx"
      voices: "models/kokoro/voices-martin.npz"
      voice: "martin"          # only voice in this file
      lang: "de"               # espeak phonemizer language
      speed: 1.0
    en:
      model: "models/kokoro/kokoro-v1.0.onnx"   # or kokoro-v1.0.int8.onnx (smaller/faster)
      voices: "models/kokoro/voices-v1.0.bin"
      voice: "bf_emma"         # any voice from voices-v1.0.bin
      lang: "en-gb"
      speed: 1.0

# Only used when tts.engine is "piper" (language -> .onnx model, sidecar .onnx.json next to it).
# piper:
#   voices:
#     de: "models/piper/de_DE-thorsten-medium.onnx"
#     en: "models/piper/en_GB-alba-medium.onnx"   # alba: female, Scottish English

# Only needed when stt.engine or tts.engine is "gemini".
# gemini:
#   api_key: null                             # or set env var GEMINI_API_KEY (env wins)
#   stt_model: "gemini-3.6-flash"
#   tts_model: "gemini-3.1-flash-tts-preview"
#   stt_timeout_s: 10                         # per request; on timeout the local engine takes over
#   tts_timeout_s: 20
#   tts_voices:                               # prebuilt Gemini voice per language
#     de: "Kore"
#     en: "Puck"

# Only needed when stt.engine or tts.engine is "deepgram".
# deepgram:
#   api_key: null                             # or set env var DEEPGRAM_API_KEY (env wins)
#   stt_model: "nova-3"
#   stt_timeout_s: 10                         # per request; on timeout the local engine takes over
#   tts_timeout_s: 20
#   tts_sample_rate: 24000                    # PCM rate requested from /v1/speak
#   tts_voices:                               # Aura-2 model per language (language is the model suffix)
#     de: "aura-2-viktoria-de"
#     en: "aura-2-thalia-en"

barge_in:
  resume_listening: true    # wakeword during playback -> straight back to LISTENING

dialog:
  enabled: true             # after every answer the mic re-opens (no wakeword) for a follow-up
  followup_timeout_s: 6     # silence that ends the conversation (first turn uses vad.no_speech_timeout_s)
  earcon: "wake"            # earcon when the follow-up mic opens ("wake" or "ack")

earcons:
  enabled: true
  wake: "sounds/wake.wav"
  ack: "sounds/ack.wav"
  error: "sounds/error.wav"
  idle: "sounds/idle.wav"

logging:
  level: "INFO"
