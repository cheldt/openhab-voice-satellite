# openhab-voice-satellite configuration. Copy to config.yaml and adjust.
# Relative paths are resolved against this file's directory.

audio:
  input_device: null        # substring of a PipeWire node name/description (see: openhab-voice-satellite --list-devices); null = default node
  output_device: null
  frame_ms: 80              # 1280 samples = one openWakeWord chunk
  wakeup_preamble_ms: 0     # ramped noise before a sound after an idle gap; wakes powered speakers from signal-sensing mute (try 500)
  wakeup_preamble_idle_s: 60  # gap that counts as idle; match the speaker's mute delay (0 = preamble before every sound)

wakeword:
  engine: "openwakeword"    # or "violawake" / "wakeforge" (better benchmarks, but no pretrained phrases — you train the model)
  model: "hey_jarvis"       # openWakeWord pretrained name, path to a custom .onnx, or (wakeforge) a model DIRECTORY
  threshold: 0.5
  threshold_speaking: 0.7   # raised while TTS is audible (echo mitigation)
  stop_model: null          # optional: path to a custom-trained "stop" model (.onnx)
  stop_threshold: 0.5
  stop_threshold_speaking: null  # null = same as stop_threshold; the stop model is the one that must run during playback
  patience: 1               # consecutive frames above threshold before firing; 2 rejects single-frame spikes for 80 ms of latency
  stop_patience: 1
  verifier_model: null      # optional per-speaker openWakeWord custom verifier; UNPICKLED AT STARTUP, treat as executable code
  stop_verifier_model: null
  verifier_threshold: 0.1   # base score above which the verifier is consulted; it then REPLACES the score, so re-check thresholds
  # Only used when engine is "violawake". Both blocks are off by default.
  # NOTE: engine "violawake" needs audio.frame_ms to be a multiple of 20, and
  # every model gets its own feature backbone — setting stop_model here costs
  # roughly twice the per-frame CPU that openWakeWord would.
  # viola:
  #   adaptive:               # move the wake threshold with the room's noise floor
  #     enabled: false        # when on, this REPLACES wakeword.threshold
  #     noise_window_s: 5.0
  #     min_threshold: 0.6    # the band the adapted threshold stays inside
  #     max_threshold: 0.95
  #     snr_boost_db: 6.0
  #     snr_penalty_db: 3.0
  #   power:                  # skip scoring frames that are clearly silence
  #     enabled: false
  #     duty_cycle_n: 1       # >1 also drops speech frames mid-stream; recall suffers
  #     silence_rms: 10.0
  #     activity_threshold: 0.3
  #     active_window_s: 3.0
  #   verifier:               # stage-2 CNN re-scoring the 1.5 s behind each trigger;
  #                           # lets wakeword.threshold sit low (recall) while the
  #                           # verifier keeps false accepts out. Needs the model
  #                           # AND its mel filterbank as a pair — see
  #                           # violawakeword/TRAINING.md for training both.
  #     model: null           # path to a verifier .onnx (input: 40x151 mel-PCEN)
  #     mel_basis: null       # path to the matching verifier_melfb_40.npy
  #     threshold: 0.1        # verifier score needed to release a wake
  #     delay_ms: 300         # audio gathered past the trigger before scoring
  # Only used when engine is "wakeforge". wakeword.model names the directory
  # ww_trainer wrote; these are the two filenames inside it. The defaults are
  # what ww_trainer-quickstart writes, ww_trainer-train names them after the
  # featurizer and head instead. Like violawake, stop_model here runs its own
  # featurizer and roughly doubles the per-frame CPU.
  # wakeforge:
  #   featurizer: "best_f1_featurizer.onnx"
  #   head: "best_f1.onnx"

vad:
  threshold: 0.5
  silence_ms: 1200          # trailing silence that ends the utterance
  no_speech_timeout_s: 8    # LISTENING -> IDLE if nothing is said
  max_utterance_s: 15

stt:
  engine: "local"           # "gemini"/"deepgram" = cloud STT; falls back to local whisper on failure
  model: "small"            # faster-whisper model name or local path ("base" = faster, less accurate)
  compute_type: "int8"
  cpu_threads: 3            # leave 1 core free: wakeword must keep its 80 ms cadence during transcription (barge-in)
  beam_size: 1              # 1 = greedy (fastest); 5 = more accurate, much slower
  languages: ["de", "en"]   # auto-detect restricted to these; single entry skips detection

openhab:
  url: "http://openhab.local:8080"
  api_token: null           # or set env var OPENHAB_TOKEN (env wins)
  # ?llmTools= param for /rest/voice/interpreters; null = omit.
  # "web-search" needs the org.openhab.voice.websearch add-on + a SearxNG instance.
  llm_tools: "item-send-command,item-get-state,get-date-time,web-search"
  response_timeout_s: 30
  verify_ssl: true          # false accepts self-signed certificates

tts:
  engine: "piper"          # "piper" = local; "gemini"/"deepgram" = cloud TTS, falls back to piper on failure
  default_language: "de"


# Used when tts.engine is "piper" and as fallback for the cloud engines
# (language -> .onnx model, sidecar .onnx.json next to it).
# piper:
#   voices:
#     de: "models/piper/de_DE-thorsten-medium.onnx"
#     en: "models/piper/en_GB-alba-medium.onnx"   # alba: female, Scottish English

# Only needed when stt.engine or tts.engine is "gemini".
# gemini:
#   api_key: null                             # or set env var GEMINI_API_KEY (env wins)
#   stt_model: "gemini-3.6-flash"
#   tts_model: "gemini-3.1-flash-tts-preview"
#   stt_timeout_s: 10                         # per request; on timeout the local engine takes over
#   tts_timeout_s: 20
#   tts_voices:                               # prebuilt Gemini voice per language
#     de: "Kore"
#     en: "Puck"

# Only needed when stt.engine or tts.engine is "deepgram".
# deepgram:
#   api_key: null                             # or set env var DEEPGRAM_API_KEY (env wins)
#   stt_model: "nova-3"
#   stt_timeout_s: 10                         # per request; on timeout the local engine takes over
#   tts_timeout_s: 20
#   tts_sample_rate: 24000                    # PCM rate requested from /v1/speak
#   tts_voices:                               # Aura-2 model per language (language is the model suffix)
#     de: "aura-2-viktoria-de"
#     en: "aura-2-thalia-en"

barge_in:
  resume_listening: true    # wakeword during playback -> straight back to LISTENING

dialog:
  enabled: true             # after every answer the mic re-opens (no wakeword) for a follow-up
  followup_timeout_s: 6     # silence that ends the conversation (first turn uses vad.no_speech_timeout_s)
  earcon: "wake"            # earcon when the follow-up mic opens ("wake" or "ack")

earcons:
  enabled: true
  wake: "sounds/wake.wav"
  ack: "sounds/ack.wav"
  error: "sounds/error.wav"
  idle: "sounds/idle.wav"

logging:
  level: "INFO"
