[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhab-voice-satellite"
version = "0.1.0"
description = "Wakeword voice assistant bridging a microphone to openHAB chat items (STT via faster-whisper, TTS via Piper)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# NOTE: openwakeword is NOT listed here on purpose. Its published metadata
# hard-requires tflite-runtime on Linux, which has no wheels for current
# Pythons — but the ONNX backend works fine without it. Install it separately:
#   pip install --no-deps openwakeword
# Its actual runtime needs (onnxruntime, scipy, scikit-learn, tqdm, requests)
# are covered below.
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "scipy>=1.11",
    "scikit-learn>=1.0,<2",
    "tqdm>=4.0",
    "requests>=2.0",
    "pysilero-vad>=2.0,<3.0",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    "aiohttp>=3.10",
    "PyYAML>=6.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "flake8>=7.0",
]
# Audio I/O uses GStreamer via PyGObject. On Debian/RPi production installs,
# prefer apt python3-gi with a --system-site-packages venv (PyGObject has no
# manylinux wheels; pip builds need libgirepository/cairo dev headers). This
# extra exists for CI and dev boxes that have those headers.
gst = [
    "PyGObject>=3.44",
]

[project.scripts]
openhab-voice-satellite = "openhab_voice_satellite.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# The central engine contract is a typing Protocol and the codebase is fully
# annotated, so a type gate is cheap here. The pydantic plugin is not optional:
# without it every `default_factory=SomeModel` reads as an error.
plugins = ["pydantic.mypy"]
files = ["src/openhab_voice_satellite"]
# GStreamer (gi), piper, faster_whisper, openwakeword and pysilero ship no
# stubs; the imports are all lazy and guarded at their call sites.
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Warnings are failures. With asyncio_mode = "auto" a forgotten await is a
# RuntimeWarning and nothing else — the test passes vacuously, asserting
# nothing — and a leaked transport or unclosed session only ever shows up as
# a PytestUnraisableExceptionWarning. Neither could fail a build before.
# Both ignores are third-party and outside our reach, and both come from
# PyGObject: its import machinery trips ImportWarning on the Pi's 3.11 (the
# deployment target), and its overrides call a deprecated GLib symbol.
# ImportWarning is ignored by CPython's own default filters, so restoring that
# for it costs nothing — "error" had promoted a warning Python itself does not
# show. The GLib one is matched by message rather than by class so the filter
# cannot fail to resolve on a checkout without PyGObject (where gst tests skip).
filterwarnings = [
    "error",
    "ignore::ImportWarning",
    "ignore:GLib.unix_signal_add_full is deprecated:DeprecationWarning",
]
