[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhab-voice-satellite"
version = "0.1.0"
description = "Wakeword voice assistant bridging a microphone to openHAB chat items (STT via faster-whisper, TTS via Kokoro)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# NOTE: openwakeword is NOT listed here on purpose. Its published metadata
# hard-requires tflite-runtime on Linux, which has no wheels for current
# Pythons — but the ONNX backend works fine without it. Install it separately:
#   pip install --no-deps openwakeword
# Its actual runtime needs (onnxruntime, scipy, scikit-learn, tqdm, requests)
# are covered below.
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "scipy>=1.11",
    "scikit-learn>=1.0,<2",
    "tqdm>=4.0",
    "requests>=2.0",
    "pysilero-vad>=2.0,<3.0",
    "faster-whisper>=1.1",
    # kokoro-onnx caps Python at <3.14 — use a 3.11-3.13 interpreter for the venv.
    "kokoro-onnx>=0.5,<0.6",
    "piper-tts>=1.3",
    "aiohttp>=3.10",
    "PyYAML>=6.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Audio I/O uses GStreamer via PyGObject. On Debian/RPi production installs,
# prefer apt python3-gi with a --system-site-packages venv (PyGObject has no
# manylinux wheels; pip builds need libgirepository/cairo dev headers). This
# extra exists for CI and dev boxes that have those headers.
gst = [
    "PyGObject>=3.44",
]

[project.scripts]
openhab-voice-satellite = "openhab_voice_satellite.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: tests that load real ML models (deselect with '-m \"not slow\"')",
]
